<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div id="calculator">
            <div id="topScreen">
                <input type="number" placeholder="Enter Value">
            </div>
            <div id="flexGrid">
                <div id="numberBox">
                    <button value="1">1</button>
                    <button value="2">2</button>
                    <button value="3">3</button>
                    <button value="4">4</button>
                    <button value="5">5</button>
                    <button value="6">6</button>
                    <button value="7">7</button>
                    <button value="8">8</button>
                    <button value="9">9</button>
                    <button value="0">0</button>
                </div>
                <div id="operatorsBox">
                    <button class="operators" id="plus">+</button>
                    <button class="operators" id="minus">-</button>
                    <button class="operators" id="multiply">*</button>
                    <button class="operators" id="divion">/</button>
                    <button class="operators" id="parcentage">%</button>   
                    <button id="calculationEqual">=</button>   
                </div>
            </div>
        </div>
    </div>


    <script src="assets/js/script.js"></script>
    
</body>
</html>
